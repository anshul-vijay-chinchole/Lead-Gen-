[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "leadgen"
version = "0.1.0"
description = "Niche-agnostic, signal-led lead generation engine: find -> filter -> enrich -> verify -> score -> write -> send -> classify replies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]
sheets = ["gspread>=5"]

[project.scripts]
leadgen = "leadgen.cli:main"

[tool.setuptools.packages.find]
include = ["leadgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
